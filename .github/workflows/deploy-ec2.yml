name: Deploy backend to EC2

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check entrypoint syntax
        run: |
          node --check src/server.js
          node --check src/app.js

      - name: Verify CORS policy
        run: npm run check:cors

      - name: Run production hardening tests
        run: npm run test:hardening

  deploy:
    name: Deploy backend
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy and verify health
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
          EC2_APP_PATH: ${{ vars.EC2_APP_PATH }}
          PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}
          BACKEND_HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          set -euo pipefail

          for required_name in EC2_HOST EC2_USER EC2_SSH_PRIVATE_KEY EC2_SSH_KNOWN_HOSTS EC2_APP_PATH PM2_APP_NAME BACKEND_HEALTH_URL; do
            if [ -z "${!required_name:-}" ]; then
              echo "Missing GitHub production secret/variable: ${required_name}" >&2
              exit 1
            fi
          done

          [[ "$EC2_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "EC2_HOST has an invalid format" >&2; exit 1; }
          [[ "$EC2_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "EC2_USER has an invalid format" >&2; exit 1; }
          [[ "$EC2_APP_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "EC2_APP_PATH must be an absolute path without spaces" >&2; exit 1; }
          [[ "$PM2_APP_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "PM2_APP_NAME has an invalid format" >&2; exit 1; }
          [[ "$BACKEND_HEALTH_URL" =~ ^https?://[A-Za-z0-9._:/-]+$ ]] || { echo "BACKEND_HEALTH_URL has an invalid format" >&2; exit 1; }

          deploy_key="${RUNNER_TEMP}/mountreality_ec2_deploy_key"
          known_hosts="${RUNNER_TEMP}/mountreality_ec2_known_hosts"
          umask 077
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$deploy_key"
          printf '%s\n' "$EC2_SSH_KNOWN_HOSTS" > "$known_hosts"

          ssh \
            -i "$deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            "${EC2_USER}@${EC2_HOST}" \
            "bash -s -- '$EC2_APP_PATH' 'main' '$PM2_APP_NAME' '$BACKEND_HEALTH_URL'" \
            < scripts/deploy-ec2.sh
